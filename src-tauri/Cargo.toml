[package]
name = "notespro"
version = "1.0.3"
description = "Local block-based notebook"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "notespro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
